<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandorax</title>
    <link rel="stylesheet" href="assets/contact.css">
    <link rel="icon" href="assets/webstuff/pandoraxO">
    <style>
      @import url('https://fonts.cdnfonts.com/css/poppins');
    </style>
</head>
<body>
    <header >
      <div class="head" style="padding-bottom: 2vh">
        <div><img id="logo" src="assets/webstuff/pandorax_new_logo.png" /> </div>
        <a href="index.html"><button id="yoop">Home</button></a>
        <!-- <a href="index.html"><img id="logo" src="assets/webstuff/pandorax_new_logo.png" /></a> -->
        <a href="projects.html"><button id="prod">Projects</button></a>
        <a href="programs.html"><button id="prog">Programs</button></a>
        <a href="team.html"><button id="te">Our Team</button></a>
        <a href="contact.html"><button id="cont">Contact</button></a>
    </div>
    </header>

  <p class="cool">
    Questions or concerns? Reach out to us at info@pandorax.org (the preferred method), or fill out the form below:
  </p>
    
  <div class="form">
    <form id="contactform">
      <div class="formrow">
        <div class="formfield">
          <label for="cname">Name</label>
          <input type="text" id="cname" placeholder="Your name" required>
        </div>
        <div class="formfield">
          <label for="cemail">Email</label>
          <input type="email" id="cemail" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="formfield">
        <label for="csubject">Subject</label>
        <select id="csubject" required>
          <option value="" disabled selected>Choose a topic</option>
          <option value="General question">General question</option>
          <option value="Bootcamps">Bootcamps</option>
          <option value="Olympiad guides">Olympiad guides</option>
          <option value="Partnership or sponsorship">Partnership or sponsorship</option>
          <option value="Joining the team">Joining the team</option>
          <option value="Something else">Something else</option>
        </select>
      </div>
      <div class="formfield">
        <label for="cmessage">Message</label>
        <textarea id="cmessage" rows="6" placeholder="Tell us what's on your mind" required></textarea>
      </div>
      <input type="checkbox" id="cbotcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="csend">Send message</button>
      <p id="cstatus" class="formstatus" role="status" aria-live="polite"></p>
    </form>
  </div>  
    
  <section class="copyright">
    <p><span>&#169;</span> 2026 by Pandorax. All Rights Reserved.</p>
  </section>
    
    


<script>
    document.addEventListener('DOMContentLoaded', function () {
  var contButton = document.getElementById('cont');

  // Function to check if the current page is "products.html"
  function isOnProductsPage() {
    return window.location.pathname.endsWith('contact.html');
  }

  // Apply the style on initial page load
  if (isOnProductsPage()) {
    contButton.style.borderBottom = '1px solid #fff';
  }
});
</script>
<script>
  // Web3Forms access key. Public by design \u2014 it only allows posting to this form.
  var ACCESS_KEY = '07e1b2ac-a923-47ae-be75-ddfabc70099a';

  document.getElementById('contactform').addEventListener('submit', function (e) {
    e.preventDefault();

    var form = e.target;
    var send = document.getElementById('csend');
    var status = document.getElementById('cstatus');

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    var name = document.getElementById('cname').value.trim();
    var topic = document.getElementById('csubject').value;

    send.disabled = true;
    send.textContent = 'Sending...';
    status.className = 'formstatus';
    status.textContent = '';

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        access_key: ACCESS_KEY,
        subject: '[' + topic + '] ' + name,
        name: name,
        // Web3Forms sets the reply-to address from this field.
        email: document.getElementById('cemail').value.trim(),
        topic: topic,
        message: document.getElementById('cmessage').value.trim(),
        botcheck: document.getElementById('cbotcheck').checked
      })
    }).then(function (res) {
      if (res.status === 200) {
        status.className = 'formstatus ok';
        status.textContent = 'Thanks \u2014 your message is on its way. We usually reply within a few days.';
        form.reset();
      } else {
        status.className = 'formstatus bad';
        status.textContent = 'Something went wrong. Please email us directly at info@pandorax.org.';
      }
    }).catch(function () {
      status.className = 'formstatus bad';
      status.textContent = 'Could not reach the server. Please email us directly at info@pandorax.org.';
    }).then(function () {
      send.disabled = false;
      send.textContent = 'Send message';
    });
  });
</script>
<script src="assets/script.js"></script>
<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
    AOS.init();
</script>    
</body>
</html>
